<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doXQ — Sign In | Healthcare Policy RAG</title>
    <meta name="description"
        content="Sign in to doXQ Healthcare Policy RAG to query your health policy documents with AI.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050a0e;
            --bg-subtle: #0a1218;
            --surface: rgba(13, 25, 35, 0.7);
            --surface-hover: rgba(16, 32, 45, 0.8);
            --border: rgba(6, 182, 212, 0.12);
            --border-focus: rgba(6, 182, 212, 0.35);
            --accent: #06b6d4;
            --accent-secondary: #0d9488;
            --accent-glow: rgba(6, 182, 212, 0.15);
            --accent-dim: rgba(6, 182, 212, 0.08);
            --text: #94a3b8;
            --text-dim: #475569;
            --text-bright: #e2e8f0;
            --white: #f8fafc;
            --green: #34d399;
            --red: #f87171;
            --red-dim: rgba(248, 113, 113, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(6, 182, 212, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(13, 148, 136, 0.04) 0%, transparent 50%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            animation: gridDrift 20s linear infinite;
        }

        @keyframes gridDrift {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(60px, 60px);
            }
        }

        .page {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Card */
        .card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border: 1.5px solid var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-dim);
            position: relative;
        }

        .logo-icon svg {
            width: 20px;
            height: 20px;
            color: var(--accent);
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 14px;
            background: var(--accent);
            opacity: 0;
            filter: blur(8px);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                opacity: 0;
            }

            50% {
                opacity: 0.15;
            }
        }

        .logo-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--white);
            letter-spacing: -0.5px;
        }

        .logo-tag {
            font-size: 10px;
            font-weight: 500;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-left: 54px;
            margin-bottom: 36px;
            font-family: 'IBM Plex Mono', monospace;
        }

        /* Form */
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 20px;
            position: relative;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            font-family: 'IBM Plex Mono', monospace;
        }

        .field input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .field input::placeholder {
            color: var(--text-dim);
        }

        .field input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.25s;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .submit-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.2);
        }

        .submit-btn:hover::before {
            opacity: 1;
        }

        .submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        .toast {
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'IBM Plex Mono', monospace;
            display: none;
            animation: toastIn 0.3s ease;
        }

        .toast.show {
            display: block;
        }

        .toast.error {
            background: var(--red-dim);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: var(--red);
        }

        .toast.success {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            color: var(--green);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer link */
        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .footer-link a:hover {
            opacity: 0.8;
        }

        /* Pulse decoration */
        .pulse-ring {
            position: absolute;
            top: -80px;
            right: -80px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 1px solid rgba(6, 182, 212, 0.08);
            animation: ringPulse 4s ease-in-out infinite;
        }

        .pulse-ring:nth-child(2) {
            width: 260px;
            height: 260px;
            top: -110px;
            right: -110px;
            animation-delay: 1s;
        }

        @keyframes ringPulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>

            <div class="logo">
                <div class="logo-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
                    </svg>
                </div>
                <span class="logo-name">doXQ</span>
            </div>
            <div class="logo-tag">Healthcare Policy Intelligence</div>

            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to access your policy documents</p>

            <form id="login-form" autocomplete="on">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username"
                        autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="toast" id="toast"></div>

            <div class="footer-link">
                Don't have an account? <a href="/register">Create one</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const toast = document.getElementById('toast');

        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = `toast show ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 4000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showToast('Please fill in all fields.', 'error');
                return;
            }

            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => { window.location.href = '/dashboard'; }, 600);

            } catch (err) {
                showToast(err.message, 'error');
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
